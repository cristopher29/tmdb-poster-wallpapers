name: Generate TMDB wallpapers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore TMDB image cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: tmdb-poster-cache-${{ runner.os }}-${{ hashFiles('config/weekly.json') }}
          restore-keys: |
            tmdb-poster-cache-${{ runner.os }}-

      - name: Generate wallpapers
        run: npm run generate:weekly

      - name: Commit generated wallpapers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No generated wallpaper changes."
          else
            git commit -m "Update generated TMDB wallpapers"
            git push
          fi
